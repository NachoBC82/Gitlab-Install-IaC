cluster_name: "Kubernetes Cluster"
network:
  control_ip: "192.168.56.10"
  worker_ip: "192.168.56.20"
  postgres_ip: "192.168.56.30" # IP estática base para Postgres
  redis_ip: "192.168.56.40" # IP estática base para Redis
  minio_ip: "192.168.56.50" # IP estática base para MinIO
  dns_servers:
    - 8.8.8.8
    - 1.1.1.1
  pod_cidr: "172.16.1.0/16"
  service_cidr: "172.17.1.0/18"
nodes:
  # Nodos de control
  control:
    count: 1
    cpu: 2
    memory: 4096
  postgre:
    count: 1 #3
    cpu: 1 #4
    memory: 2048 #15360 (15GB)
  redis:
    count: 1 #3
    cpu: 1 #2
    memory: 1024 #7680 (7.5GB)
  minio:
    count: 1 #4
    cpu: 2 #4
    memory: 2048 # (8 a 16GB)
  workers:
    count: 2
    cpu: 1
    memory: 2048
software:
  box: "bento/ubuntu-24.04"
  calico: "3.31.0"
  dashboard: "7.14.0"
  kubernetes: "1.34.0-*"
  helm: "3.21.2"
  os: "xUbuntu_24.04"
shared_folders:
  - host_path: "../images"
    vm_path: "/vagrant/images"