---
- name: "Fase 1: Preparación Común de los Nodos (Controlplane y Workers)"
  hosts: all
  become: true
  gather_facts: true  # Aseguramos que cargue la información del sistema
  tasks:
    - name: Desactivar swap inmediatamente
      command: swapoff -a
      changed_when: false

    - name: Quitar la swap del fstab para persistencia tras reinicio
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1'

    - name: Cargar módulos del kernel requeridos por Containerd
      copy:
        dest: /etc/modules-load.d/containerd.conf
        content: |
          overlay
          br_netfilter

    - name: Aplicar módulos del kernel de inmediato
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configurar parámetros sysctl para redes de Kubernetes
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
        reload: yes
      loop:
        - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { name: "net.ipv4.ip_forward", value: "1" }
        - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }

    - name: Instalar paquetes base necesarios
      apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - ca-certificates
        state: present
        update_cache: yes

    - name: Crear directorio para keyring de Docker
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Agregar llave GPG oficial de Docker (para containerd)
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
        keyring: /etc/apt/keyrings/docker.gpg

    - name: Añadir repositorio de Docker
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu noble stable"
        state: present
        filename: docker

    - name: Instalar Containerd
      apt:
        name: containerd.io
        state: present
        update_cache: yes

    - name: Crear directorio de configuración de Containerd
      file:
        path: /etc/containerd
        state: directory

    - name: Generar configuración por defecto de Containerd
      shell: "containerd config default > /etc/containerd/config.toml"

    - name: Habilitar el plugin CRI (remover de la lista de deshabilitados si existe)
      replace:
        path: /etc/containerd/config.toml
        regexp: 'disabled_plugins = \["cri"\]'
        replace: 'disabled_plugins = []'

    - name: Configurar SystemdCgroup en true para Containerd
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Reiniciar y habilitar Containerd para aplicar cambios de CRI
      systemd:
        name: containerd
        state: restarted
        enabled: yes
        daemon_reload: yes

    - name: Crear directorio para keyring de Kubernetes
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Agregar llave GPG oficial de Kubernetes (v1.30)
      apt_key:
        url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
        state: present
        keyring: /etc/apt/keyrings/kubernetes-archive-keyring.gpg

    - name: Añadir repositorio oficial de Kubernetes v1.30
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-archive-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
        state: present
        filename: kubernetes

    - name: Instalar kubelet, kubeadm y kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: yes

    - name: Marcar paquetes de Kubernetes para evitar actualizaciones automáticas
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

- name: "Fase 2: Inicialización del Nodo Controlplane"
  hosts: controlplane
  become: true
  tasks:
    - name: Inicializar el clúster con kubeadm (solo si no se ha hecho ya)
      command: >
        kubeadm init
        --apiserver-advertise-address=192.168.56.10
        --pod-network-cidr=172.16.1.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Crear directorio .kube para el usuario vagrant
      file:
        path: /home/vagrant/.kube
        state: directory
        owner: vagrant
        group: vagrant
        mode: '0755'

    - name: Copiar admin.conf al home de vagrant
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/vagrant/.kube/config
        remote_src: yes
        owner: vagrant
        group: vagrant
        mode: '0600'

    - name: Instalar operador de red Calico CNI
      become: false
      command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml
      args:
        creates: /home/vagrant/.kube/.calico_installed
      register: calico_install

    - name: Marcar instalación de Calico
      file:
        path: /home/vagrant/.kube/.calico_installed
        state: touch
      when: calico_install.changed

    - name: Generar comando de unión dinámico (join command)
      command: kubeadm token create --print-join-command
      register: join_command_raw

    - name: Guardar comando de unión en un "fact" global
      set_fact:
        join_command: "{{ join_command_raw.stdout }}"

- name: "Fase 3: Unión de los Workers al Clúster"
  hosts: workers
  become: true
  tasks:
    - name: Unir el nodo worker al clúster (solo si no está ya unido)
      command: "{{ hostvars['controlplane']['join_command'] }}"
      args:
        creates: /etc/kubernetes/kubelet.conf