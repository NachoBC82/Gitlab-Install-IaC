---
# ansible/playbooks/play_redis.yaml

- name: "Instalación y Configuración de Redis Externo (Fortificado)"
  hosts: redis_nodes
  become: true

  tasks:
    - name: Cargar variables cifradas desde el Vault
      include_vars:
        file: ../../secrets/db_vars.yaml

    - name: Instalar Redis Server y dependencias de Python
      apt:
        name:
          - redis-server
          - python3-redis
        state: present
        update_cache: yes

    # === OPTIMIZACIONES DE KERNEL DE PRODUCCIÓN ===
    # Sin esto, Redis lanza alertas críticas de rendimiento y Sidekiq puede fallar bajo carga
    
    - name: Configurar sobreasignación de memoria en el Kernel (overcommit_memory)
      sysctl:
        name: vm.overcommit_memory
        value: "1"
        state: present
        reload: yes

    - name: Incrementar las conexiones permitidas en la cola del Kernel (somaxconn)
      sysctl:
        name: net.core.somaxconn
        value: "1024"
        state: present
        reload: yes

    - name: Desactivar Transparent Huge Pages (THP) de inmediato
      shell: echo never > /sys/kernel/mm/transparent_hugepage/enabled
      changed_when: false

    - name: Asegurar que THP permanezca desactivado tras reinicios del sistema
      lineinfile:
        path: /etc/rc.local
        line: "echo never > /sys/kernel/mm/transparent_hugepage/enabled"
        create: true
        mode: '0755'

    # === CONFIGURACIÓN Y FORTIFICACIÓN DE RED/AUTH ===

    - name: Configurar binding de red seguro (SOLO localhost e IP privada eth1)
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^bind .*"
        line: "bind 127.0.0.1 {{ ansible_eth1.ipv4.address }}"
      notify: Reiniciar Redis

    - name: Forzar autenticación protegida (requirepass)
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^#?\\s*requirepass .*"
        line: "requirepass {{ gitlab_redis_password }}"
      notify: Reiniciar Redis

    - name: Asegurar que el modo protegido está activo
      lineinfile:
        path: /etc/redis/redis.conf
        regexp: "^protected-mode .*"
        line: "protected-mode yes"
      notify: Reiniciar Redis

    - name: Asegurar que Redis esté iniciado y habilitado en systemd
      systemd:
        name: redis-server
        state: started
        enabled: yes

  handlers:
    - name: Reiniciar Redis
      systemd:
        name: redis-server
        state: restarted